<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIFullCine - 영화 상세</title>
    <link rel="stylesheet" href="./css/movie_detal.css" />
  </head>
  <body>
    <header>
      <a href="CINEMA_search.html" class="logo-container">
        <svg
          width="36"
          height="36"
          viewBox="0 0 40 40"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="20" cy="20" r="20" fill="var(--point-sage)" />
          <polygon points="16,12 16,28 28,20" fill="var(--bg-midnight)" />
        </svg>
        AIFullCine
      </a>
      <nav>
        <ul>
          <li><a href="CINEMA_search.html">홈</a></li>
          <li><a href="#">영화 피드</a></li>
          <li><a href="#">마이 평점</a></li>
        </ul>
      </nav>
      <div class="header-right">
        <div class="search-bar">
          <input
            type="text"
            id="headerSearch"
            placeholder="영화 검색..."
            autocomplete="off"
          />
          <button class="search-icon" id="headerSearchBtn">🔍</button>
        </div>
        <a href="#" class="btn-auth btn-membership" id="detailMembershipBtn"
          >👑 멤버십</a
        >
        <div class="auth-buttons">
          <a href="login.html" class="btn-auth btn-login">로그인</a>
          <a href="signup.html" class="btn-auth btn-signup">회원가입</a>
        </div>
      </div>
    </header>

    <section class="movie-hero" id="movieHero">
      <a href="CINEMA_search.html" class="hero-back-btn">← 목록으로</a>
    </section>

    <main class="detail-container" id="detailContainer">
      <div class="poster-area">
        <img id="posterImg" src="" alt="영화 포스터" />
        <div class="tag-list" id="tagList"></div>
      </div>

      <div class="info-area">
        <h1 class="movie-title-main" id="titleMain">로딩 중...</h1>
        <p class="movie-title-en" id="titleEn"></p>

        <div class="movie-sub-meta" id="subMeta">
          <span class="rating-large" id="ratingLarge">★ —</span>
        </div>

        <div class="info-cards" id="infoCards"></div>

        <div class="ai-badge" id="aiBadge">
          <span class="lock" id="aiLock">🔒</span>
          <span id="aiText">AI 정밀 분석 평점 보기 (프리미엄 전용)</span>
          <span>→</span>
        </div>

        <div class="section-heading">줄거리</div>
        <div class="movie-story" id="movieStory">
          영화 정보를 불러오는 중입니다...
        </div>

        <div class="section-heading" id="castHeading" style="display: none">
          출연진
        </div>
        <div class="cast-list" id="castList"></div>

        <section class="comment-section">
          <h3>이 영화 평가하기</h3>
          <div class="star-rating" id="starRating">
            <button class="star-btn" data-val="1">★</button>
            <button class="star-btn" data-val="2">★</button>
            <button class="star-btn" data-val="3">★</button>
            <button class="star-btn" data-val="4">★</button>
            <button class="star-btn" data-val="5">★</button>
            <span class="star-label" id="starLabel">평점을 선택하세요</span>
          </div>
          <div class="comment-form">
            <textarea
              id="commentInput"
              placeholder="이 영화에 대한 한 줄 평이나 기대평을 자유롭게 남겨보세요."
            ></textarea>
            <button class="btn-comment" id="commentSubmit">등록</button>
          </div>
        </section>
      </div>
    </main>

    <section class="related-section">
      <h2>비슷한 장르 추천</h2>
      <div class="related-grid" id="relatedGrid"></div>
    </section>

    <footer><p>&copy; 2026 AIFullCine. All rights reserved.</p></footer>

    <div class="modal-overlay" id="paywallModal">
      <div class="modal-content">
        <button class="modal-close" id="closePaywallBtn">&times;</button>
        <div class="modal-icon">👑</div>
        <h3 class="modal-title">프리미엄 전용 콘텐츠</h3>
        <p class="modal-text">
          이 영화의 <strong>AI 정밀 분석 평점</strong>은<br />멤버십 회원에게만
          공개됩니다.<br /><br />지금 가입하고 숨겨진 인사이트를 확인하세요!
        </p>
        <button class="btn-modal-action" id="goPaymentFromDetailBtn">
          멤버십 혜택 알아보기
        </button>
      </div>
    </div>
    <script src="./js/movie_detal.js"></script>
  </body>
</html>
