<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 - AIFullCine</title>
    <link rel="stylesheet" href="./css/login.css" />
  </head>

  <body>
    <div class="auth-card">
      <div class="auth-header">
        <a href="CINEMA_search.html" class="logo-container">
          <svg
            width="32"
            height="32"
            viewBox="0 0 40 40"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="20" cy="20" r="20" fill="var(--point-sage)" />
            <polygon points="16,12 16,28 28,20" fill="var(--bg-midnight)" />
          </svg>
          AIFullCine
        </a>
        <p>다시 오신 것을 환영합니다</p>
      </div>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="email">이메일 주소</label>
          <input
            type="email"
            id="email"
            placeholder="name@example.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="form-options">
          <label> <input type="checkbox" /> 로그인 상태 유지 </label>
          <a href="#">비밀번호 찾기</a>
        </div>

        <button type="submit" class="btn-submit">로그인</button>
      </form>

      <div class="auth-footer">
        계정이 없으신가요? <a href="signup.html">회원가입</a>
      </div>
    </div>
  </body>
</html>
